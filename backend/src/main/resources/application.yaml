spring:
  application:
    name: spring-ai-test
  # 本地开发的密钥放在 backend/.env（已被 .gitignore 忽略，不会提交）。
  # 生产环境直接用真实环境变量注入即可，见 README「配置与密钥」。
  config:
    import: optional:file:.env[.properties]
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # allowPublicKeyRetrieval=true 不能去掉：MySQL 8 默认 caching_sha2_password，
    # useSSL=false 时驱动必须能向服务端索取 RSA 公钥，否则握手直接失败：
    # "Public Key Retrieval is not allowed"
    url: ${DB_URL:jdbc:mysql://localhost:3306/spring_ai_test?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  ai:
    deepseek:
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      chat:
        model: ${DEEPSEEK_MODEL:deepseek-chat}
        temperature: 0.7
        max-tokens: 4096
      api-key: ${DEEPSEEK_API_KEY:}
  # 表结构由 Flyway 管理；已有数据库通过 baseline 接管，不会重跑建表
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: ${MULTIPART_MAX_FILE_SIZE:10MB}
      max-request-size: ${MULTIPART_MAX_REQUEST_SIZE:12MB}

# 健康检查（部署时给 Nginx / 容器编排用）
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

mybatis:
  configuration:
    map-underscore-to-camel-case: true

# 跨域：生产建议收紧为具体域名，逗号分隔
app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:*}

# 对话请求与上下文窗口限制
chat:
  request:
    # 单条 prompt 最大字符数，超出返回 400
    max-prompt-chars: ${CHAT_MAX_PROMPT_CHARS:4000}
  context:
    # 送入大模型的历史消息条数上限（系统提示词不占这个额度）
    max-messages: ${CHAT_CONTEXT_MAX_MESSAGES:20}
    # 送入大模型的历史正文总字数上限，超出则从最旧的开始丢弃
    max-chars: ${CHAT_CONTEXT_MAX_CHARS:12000}

tts:
  max-text-chars: ${TTS_MAX_TEXT_CHARS:5000}
  cache:
    max-entries: ${TTS_CACHE_MAX_ENTRIES:200}
    max-bytes: ${TTS_CACHE_MAX_BYTES:52428800}
  aliyun:
    endpoint: ${TTS_ALIYUN_ENDPOINT:wss://convai-platform.aliyuncs.com/api-ws/v1/inference}
    api-key: ${TTS_ALIYUN_API_KEY:}
    voice-id: ${TTS_ALIYUN_VOICE_ID:}
    sample-rate: ${TTS_ALIYUN_SAMPLE_RATE:22050}
    rate: ${TTS_ALIYUN_RATE:1.0}
    pitch: ${TTS_ALIYUN_PITCH:1.0}

# 语音识别使用百炼 OpenAI 兼容网关。新版百炼可将 chat-url 改成带
# WorkspaceId 的业务空间专属地址；旧 dashscope 域名仍可用。
aliyun:
  model-studio:
    api-key: ${DASHSCOPE_API_KEY:}
    chat-url: ${DASHSCOPE_CHAT_URL:https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions}

asr:
  # Base64 会膨胀约 1/3；限制原始录音为 7MiB，确保编码后仍低于模型的 10MB 上限。
  max-audio-bytes: ${ASR_MAX_AUDIO_BYTES:7340032}
  aliyun:
    model: ${ASR_ALIYUN_MODEL:qwen3-asr-flash}

vision:
  max-image-bytes: ${VISION_MAX_IMAGE_BYTES:6291456}
  deepseek:
    # deepseek-flash 当前指向最新的 DeepSeek V4.1 Flash，并支持图片输入。
    model: ${VISION_DEEPSEEK_MODEL:deepseek-flash}

weather:
  geocoding-url: ${WEATHER_GEOCODING_URL:https://geocoding-api.open-meteo.com/v1/search}
  forecast-url: ${WEATHER_FORECAST_URL:https://api.open-meteo.com/v1/forecast}

logging:
  level:
    org.springframework.ai.chat.client.advisor: debug
    org.xzzz: debug

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 静态资源压缩（JS/CSS 体积能砍掉约 70%）。
    # 注意：/api/ 里必须 gzip off，否则 SSE 流会被压缩缓冲，打字机效果失效。
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # 前端静态资源（Vue 单页应用，未命中的路径回落到 index.html）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 反代后端，并去掉 /api 前缀，与开发期 Vite 的 rewrite 行为保持一致
    location /api/ {
        proxy_pass http://backend:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 清掉 Connection 才能让后端以 chunked 方式持续推流
        proxy_set_header Connection        "";

        # 流式（SSE）输出必须关闭缓冲，否则会攒够一整块才吐给浏览器，打字机效果就没了
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 300s;
    }

    # 部署健康检查
    location = /healthz {
        proxy_pass http://backend:8080/actuator/health;
        access_log off;
    }
}
